name: Deploy Dev - Build and Push API

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  SERVICE_NAME: laravel-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate short SHA
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVICE_NAME }}:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image
        if: github.event_name == 'push'
        run: |
          echo "✅ Published Docker Image:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVICE_NAME }}:${{ env.SHORT_SHA }}"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVICE_NAME }}:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v4
        with:
          repository: bryant2305/infraLaravelAPI
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra-repo

      - name: Generate short SHA
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Update Helm Values
        run: |
          cd infra-repo
          
          # Update the image tag in values-dev.yaml
          yq e ".services.api.image = \"${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVICE_NAME }}:${{ env.SHORT_SHA }}\"" -i helm/renthub-chart/values-dev.yaml
          
          # Configure Git
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Commit and push
          git add helm/renthub-chart/values-dev.yaml
          git commit -m "chore: update laravel-api image to ${{ env.SHORT_SHA }}" || true
          git push origin main

      - name: Deployment Summary
        run: |
          echo "🚀 Deployment initiated for Laravel API"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVICE_NAME }}:${{ env.SHORT_SHA }}"
          echo "🔄 Infrastructure repo updated with new image tag"